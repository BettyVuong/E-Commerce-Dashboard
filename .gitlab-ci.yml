# CI for linters: runs on push and merge requests. Fails pipeline if linters fail.
stages:
  - lint
  - test
  - integration

# Backend lint (Gradle/Checkstyle)
lint-backend:
  stage: lint
  image: gradle:8.5-jdk17
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: "gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/.gradle/
      - .gradle/
  script:
    - cd backend
    - ./gradlew --no-daemon clean checkstyleMain checkstyleTest -x test
  artifacts:
    when: always
    reports:
      # publish Checkstyle XML so MR viewers can download
      junit: []
    paths:
      - backend/build/reports/checkstyle/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  allow_failure: false

# Frontend lint (ESLint)
lint-frontend:
  stage: lint
  image: node:14
  cache:
    key: "node-modules-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npx eslint "src/**/*.{ts,tsx}" -f checkstyle -o eslint-report.xml
    - npm run lint
  artifacts:
    when: always
    paths:
      - frontend/eslint-report.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  allow_failure: false

# Added with issue 56
# Backend tests + coverage (JaCoCo)
test-backend:
  stage: test
  image: gradle:8.5-jdk17
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: "gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/.gradle/
      - .gradle/
  script:
    - cd backend
    - ./gradlew --no-daemon clean test jacocoTestReport printJacocoSummary
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  allow_failure: false
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/**/*.xml
    paths:
      - backend/build/reports/jacoco/test/jacocoTestReport.xml
      - backend/build/reports/jacoco/test/jacocoTestReport.csv
      - backend/build/test-results/
    expire_in: 2 weeks
  coverage: '/JaCoCo Coverage - Instructions: .*\((\d+\\.\d+)%\)/'

# Frontend tests with coverage (Jest)
test-frontend:
  stage: test
  image: node:14
  cache:
    key: "node-modules-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - mkdir -p test-results
    - export JEST_JUNIT_OUTPUT=./test-results/junit.xml
    - npm install jest-junit --no-save
    - npm run test:coverage -- --reporters=default --reporters=jest-junit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  allow_failure: false
  artifacts:
    when: always
    paths:
      - frontend/coverage/lcov.info
      - frontend/test-results/junit.xml
      - frontend/junit.xml
    expire_in: 2 weeks
    reports:
      junit: frontend/**/junit.xml
  coverage: '/All files\s+\|\s+\d+\.\d+\s+\|\s+(\d+\.\d+)%/'

# Ensure pipeline runs only for branches and MRs by default
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

# Full-stack integration tests (frontend + backend + database)
integration-full-stack:
  stage: integration
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_PROJECT_NAME: "rfm-int-${CI_PIPELINE_ID}"
  before_script:
    - apk add --no-cache curl jq
    - docker version
    - docker compose version
    - mkdir -p integration/artifacts/junit
  script:
    - docker compose -f compose.yaml up -d --build
    - DB_CONTAINER_ID="$(docker compose -f compose.yaml ps -q database)"
    - test -n "$DB_CONTAINER_ID"
    - |
      i=1
      while [ "$i" -le 60 ]; do
        status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_CONTAINER_ID")"
        if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
          echo "[ready] database container status=${status}"
          break
        fi
        echo "[wait] database container status=${status} (${i}/60)"
        i=$((i + 1))
        sleep 2
      done
    - |
      test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_CONTAINER_ID")" = "healthy" \
      || test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_CONTAINER_ID")" = "running"
    - |
      docker run --rm \
      --network "${COMPOSE_PROJECT_NAME}_backend-frontend" \
      -v "$CI_PROJECT_DIR:/workspace" \
      -w /workspace \
      -e BACKEND_BASE_URL="http://backend:8080" \
      -e FRONTEND_BASE_URL="http://frontend:3000" \
      node:20-alpine \
      sh -lc "node integration/run-integration-tests.mjs"
  after_script:
    - docker compose -f compose.yaml ps > integration/artifacts/compose-ps.txt || true
    - docker compose -f compose.yaml logs backend > integration/artifacts/backend.log || true
    - docker compose -f compose.yaml logs frontend > integration/artifacts/frontend.log || true
    - docker compose -f compose.yaml logs database > integration/artifacts/database.log || true
    - docker compose -f compose.yaml logs > integration/artifacts/container-logs.log || true
    - docker compose -f compose.yaml down -v || true
  artifacts:
    when: always
    reports:
      junit:
        - integration/artifacts/junit/*.xml
    paths:
      - integration/artifacts/
    expire_in: 2 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
  allow_failure: false
